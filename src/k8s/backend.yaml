# microk8s 의 hostpath-storage 애드온이 제공하는 기본 StorageClass 를 사용한다.
# (이전 구성은 특정 개발자 홈 경로(/home/{사용자}/...)를 PersistentVolume 으로 직접 지정하여
#  다른 서버에서는 볼륨 바인딩이 되지 않아 배포가 실패하였음)
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: bpmn-backend-pvc
spec:
  storageClassName: microk8s-hostpath
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bpmn-backend-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bpmn-backend
  template:
    metadata:
      labels:
        app: bpmn-backend
    spec:
      containers:
        - name: bpmn-backend
          image: localhost:32000/bpmn-backend:latest
          ports:
            - containerPort: 1337
          env:
            # SQLite 파일 경로. 아래 volumeMounts 의 경로와 일치해야 데이터가 보존된다.
            - name: DJANGO_DB_PATH
              value: /opt/app/data/db.sqlite3
            - name: DJANGO_ALLOWED_HOSTS
              value: "*"
            - name: DJANGO_DEBUG
              value: "0"
          volumeMounts:
            - name: bpmn-backend-storage
              mountPath: /opt/app/data
      volumes:
        - name: bpmn-backend-storage
          persistentVolumeClaim:
            claimName: bpmn-backend-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: bpmn-backend-service
spec:
  selector:
    app: bpmn-backend
  ports:
    - name: bpmn-backend
      protocol: TCP
      port: 1337
      targetPort: 1337
