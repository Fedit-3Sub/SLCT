apiVersion: apps/v1
kind: Deployment
metadata:
  name: bpmn-frontend-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bpmn-frontend
  template:
    metadata:
      labels:
        app: bpmn-frontend
    spec:
      containers:
        - name: bpmn-frontend
          image: localhost:32000/bpmn-frontend:latest
          ports:
            - containerPort: 9900
          env:
            # 클러스터 내부에서는 백엔드 서비스 이름으로 접근한다.
            # (이미지에 포함된 .env 의 host.docker.internal 주소는 쿠버네티스에서 동작하지 않음)
            - name: VITE_PROXY_URL
              value: http://bpmn-backend-service:1337

---
apiVersion: v1
kind: Service
metadata:
  name: bpmn-frontend-service
spec:
  selector:
    app: bpmn-frontend
  ports:
    - name: bpmn-frontend
      protocol: TCP
      port: 9900
      targetPort: 9900
