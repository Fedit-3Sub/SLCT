apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: bpmn-processor-pvc
spec:
  storageClassName: microk8s-hostpath
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bpmn-processor-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bpmn-processor
  template:
    metadata:
      labels:
        app: bpmn-processor
    spec:
      containers:
        - name: bpmn-processor
          image: localhost:32000/bpmn-processor:latest
          ports:
            - containerPort: 9901
          volumeMounts:
            # 파이프라인 처리 결과 저장 경로(docker compose 의 ./data 마운트와 동일한 역할)
            - name: bpmn-processor-storage
              mountPath: /app/data
      volumes:
        - name: bpmn-processor-storage
          persistentVolumeClaim:
            claimName: bpmn-processor-pvc

---
apiVersion: v1
kind: Service
metadata:
  name: bpmn-processor-service
spec:
  selector:
    app: bpmn-processor
  ports:
    - name: bpmn-processor
      protocol: TCP
      port: 9901
      targetPort: 9901

---
apiVersion: v1
kind: Service
metadata:
  name: bpmn-processor-nodeport
  labels:
    app.kubernetes.io/name: bpmn-processor-nodeport
    app.kubernetes.io/part-of: bpmn-processor-nodeport
spec:
  type: NodePort
  ports:
  - name: bpmn-processor
    port: 9901
    targetPort: 9901
    nodePort: 9901
    protocol: TCP
  selector:
    app: bpmn-processor
